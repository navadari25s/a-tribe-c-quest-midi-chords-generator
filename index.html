<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compositor MIDI Modulado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cargamos Tone.js desde CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        @keyframes progress {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
        }
        .animate-progress { animation: progress 2s infinite linear; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center px-4 py-8" style="background: #0a0a0f; color: #e0e0e0; font-family: system-ui, sans-serif;">

    <h1 class="text-2xl font-bold mb-1 text-center bg-gradient-to-r from-violet-400 to-blue-400 bg-clip-text text-transparent">
        🎹 Compositor MIDI Modulado
    </h1>
    <p class="text-zinc-600 text-xs mb-6 text-center">
        Salamander Grand Piano · Acoustic Drum Kit · Algoritmos Diatónicos
    </p>

    <!-- Tarjeta de Parámetros -->
    <div class="bg-zinc-900/50 border border-zinc-800 rounded-2xl p-6 w-full max-w-xl mb-4">
        <div class="text-[10px] uppercase tracking-widest text-zinc-600 mb-4 font-semibold">Parámetros</div>
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-black/40 border border-zinc-800/50 rounded-xl p-3">
                <div class="text-[10px] text-zinc-500 mb-1">Tempo</div>
                <div class="text-sm font-semibold text-violet-400">98 BPM</div>
            </div>
            <div class="bg-black/40 border border-zinc-800/50 rounded-xl p-3">
                <div class="text-[10px] text-zinc-500 mb-1">Estructura</div>
                <div class="text-sm font-semibold text-violet-400">16 compases</div>
            </div>
            <div class="bg-black/40 border border-zinc-800/50 rounded-xl p-3">
                <div class="text-[10px] text-zinc-500 mb-1">Nota raíz</div>
                <div id="rootDisp" class="text-sm font-semibold text-violet-400">—</div>
            </div>
            <div class="bg-black/40 border border-zinc-800/50 rounded-xl p-3">
                <div class="text-[10px] text-zinc-500 mb-1">Modo principal</div>
                <div id="modeDisp" class="text-sm font-semibold text-violet-400">—</div>
            </div>
        </div>

        <div id="loadingBar" class="mt-4 hidden">
            <div class="h-1 bg-zinc-800 rounded-full overflow-hidden">
                <div class="h-full bg-violet-500 w-1/2 animate-progress"></div>
            </div>
        </div>
    </div>

    <!-- Tarjeta de Reproducción -->
    <div class="bg-zinc-900/50 border border-zinc-800 rounded-2xl p-6 w-full max-w-xl">
        <div class="relative w-full h-24 bg-black/50 border border-zinc-800/50 rounded-xl overflow-hidden mb-3">
            <canvas id="pianoRoll" class="w-full h-full block"></canvas>
        </div>

        <!-- Barra de Progreso -->
        <div class="h-1 bg-zinc-800 rounded-full w-full mb-1.5 overflow-hidden border border-zinc-800/20">
            <div id="progressBar" class="h-full bg-gradient-to-r from-violet-500 to-blue-500 transition-all duration-300" style="width: 0%"></div>
        </div>
        <div class="flex justify-between text-[10px] text-zinc-500 mb-5">
            <span id="timeCur">0:00</span>
            <span id="timeTot">0:00</span>
        </div>

        <!-- Controles -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
            <button id="btnGen" class="py-3 rounded-xl font-bold text-sm bg-gradient-to-br from-violet-600 to-blue-600 text-white active:scale-95 disabled:opacity-20">🎲 Generar</button>
            <button id="btnPlay" disabled class="py-3 rounded-xl font-bold text-sm bg-green-900/40 text-green-400 border border-green-800/50 active:scale-95 disabled:opacity-20">▶ Play</button>
            <button id="btnStop" disabled class="py-3 rounded-xl font-bold text-sm bg-red-950/30 text-red-400 border border-red-900/50 active:scale-95 disabled:opacity-20">■ Stop</button>
            <button id="btnMidi" disabled class="py-3 rounded-xl font-bold text-sm bg-orange-950/30 text-orange-400 border border-orange-900/50 active:scale-95 disabled:opacity-20">⬇ MIDI</button>
        </div>

        <div id="statusMsg" class="mt-4 text-center text-xs font-medium min-h-[1rem] text-zinc-500">
            Cargando motores de audio...
        </div>
    </div>

    <script>
        /** ─── CONSTANTES Y LÓGICA MUSICAL ─── **/
        const BPM = 98;
        const SPB = 60 / BPM;
        const SP8 = SPB / 2;
        const MODES = {
            ionian: [0, 2, 4, 5, 7, 9, 11], dorian: [0, 2, 3, 5, 7, 9, 10],
            phrygian: [0, 1, 3, 5, 7, 8, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
            mixolydian: [0, 2, 4, 5, 7, 9, 10], aeolian: [0, 2, 3, 5, 7, 8, 10],
            locrian: [0, 1, 3, 5, 6, 8, 10]
        };
        const ESTRUCTURAS = [[0, 7, 9, 14, 16], [0, 7, 10, 14, 17], [0, 4, 7, 9, 12], [0, 11, 14, 16, 19], [0, 4, 7, 9, 12], [0, 2, 4, 9, 11]];
        const ROOTS = [48, 50, 52, 53, 55, 57];
        const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

        let currentComp = null;
        let samplers = {};
        let activeParts = [];
        let progressInterval;

        const pick = (a) => a[Math.floor(Math.random() * a.length)];
        const midiName = (m) => NOTE_NAMES[m % 12] + (Math.floor(m / 12) - 1);
        const fmtT = (s) => {
            const m = Math.floor(s / 60);
            return `${m}:${Math.floor(s % 60).toString().padStart(2, "0")}`;
        };

        /** ─── GENERACIÓN ─── **/
        function generate() {
            const notes = [];
            const rootBase = pick(ROOTS);
            const mainMode = pick(Object.keys(MODES));
            const getScaleNotes = (r, m) => MODES[m].map(i => (r + i) % 12);

            for (let vuelta = 0; vuelta < 2; vuelta++) {
                const trans = vuelta === 0 ? 0 : 2;
                const offset = vuelta * 8 * 4 * SPB;
                const currentRoot = rootBase + trans;

                for (let bar = 0; bar < 8; bar++) {
                    const barStart = offset + bar * 4 * SPB;
                    let cStarts = [0, ...Array(pick([1,2])).fill(0).map(() => pick([1,2,3,4,5,6,7]))];
                    cStarts = [...new Set(cStarts)].sort((a, b) => a - b);

                    for (let i = 0; i < cStarts.length; i++) {
                        const t0 = barStart + cStarts[i] * SP8;
                        const t1 = i < cStarts.length - 1 ? barStart + cStarts[i + 1] * SP8 : barStart + 8 * SP8;
                        const chordRootNote = currentRoot + pick(MODES[mainMode]);
                        const allowed = getScaleNotes(currentRoot, mainMode);

                        const struct = ESTRUCTURAS.find(s => s.every(iv => allowed.includes((chordRootNote + iv) % 12))) || ESTRUCTURAS[0];
                        struct.forEach(iv => {
                            let p = chordRootNote + iv;
                            while(p > 72) p -= 12;
                            notes.push({ type: "base", pitch: p, vel: 70, s: t0, e: t1 });
                        });

                        let step = cStarts[i];
                        while (barStart + step * SP8 < t1) {
                            if (Math.random() < 0.6) {
                                const melNote = currentRoot + pick(MODES[mainMode]);
                                notes.push({
                                    type: "solo", pitch: (melNote + pick([24, 36])) & 127,
                                    vel: Math.floor(Math.random() * 10) + 85,
                                    s: barStart + step * SP8, e: Math.min(barStart + step * SP8 + pick([SP8, SP8*2]), t1)
                                });
                            }
                            step++;
                        }
                    }
                    // Drums
                    for(let p=0; p<4; p++) notes.push({ type:"drum", pitch: p%2===0?36:38, vel:110, s: barStart + p*SPB, e: barStart + p*SPB + 0.1 });
                    for(let s=0; s<16; s++) notes.push({ type:"drum", pitch:42, vel: 75, s: barStart + s*(SPB/4), e: barStart + s*(SPB/4) + 0.05 });
                }
            }
            return { notes, totalDur: 16 * 4 * SPB, rootBase, mainMode };
        }

        /** ─── INTERFAZ Y AUDIO ─── **/
        async function initAudio() {
            const status = document.getElementById('statusMsg');
            document.getElementById('loadingBar').classList.remove('hidden');
            
            try {
                const pianoUrls = { A0: "A0.mp3", C1: "C1.mp3", "D#1": "Ds1.mp3", "F#1": "Fs1.mp3", A1: "A1.mp3", C2: "C2.mp3", "D#2": "Ds2.mp3", "F#2": "Fs2.mp3", A2: "A2.mp3", C3: "C3.mp3", "D#3": "Ds3.mp3", "F#3": "Fs3.mp3", A3: "A3.mp3", C4: "C4.mp3", "D#4": "Ds4.mp3", "F#4": "Fs4.mp3", A4: "A4.mp3", C5: "C5.mp3", "D#5": "Ds5.mp3", "F#5": "Fs5.mp3", A5: "A5.mp3", C6: "C6.mp3", "D#6": "Ds6.mp3", "F#6": "Fs6.mp3", A6: "A6.mp3", C7: "C7.mp3", "D#7": "Ds7.mp3", "F#7": "Fs7.mp3", A7: "A7.mp3", C8: "C8.mp3" };
                const base = "https://tonejs.github.io/audio/salamander/";
                const drumBase = "https://tonejs.github.io/audio/drum-samples/acoustic-kit/";

                samplers.base = new Tone.Sampler({ urls: pianoUrls, baseUrl: base, volume: -6 }).toDestination();
                samplers.solo = new Tone.Sampler({ urls: pianoUrls, baseUrl: base, volume: -4 }).toDestination();
                samplers.kick = new Tone.Player(drumBase + "kick.mp3").toDestination();
                samplers.snare = new Tone.Player(drumBase + "snare.mp3").toDestination();
                samplers.hihat = new Tone.Player(drumBase + "hihat.mp3").toDestination();

                await Tone.loaded();
                status.innerText = "✓ Instrumentos listos";
                status.className = "mt-4 text-center text-xs font-medium text-green-400";
                document.getElementById('loadingBar').classList.add('hidden');
            } catch (e) {
                status.innerText = "Error cargando muestras";
                console.error(e);
            }
        }

        function draw(comp) {
            const canvas = document.getElementById('pianoRoll');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            const mel = comp.notes.filter(n => n.type !== "drum");
            const ps = mel.map(n => n.pitch);
            const minP = Math.min(...ps) - 2, maxP = Math.max(...ps) + 2;
            
            ctx.clearRect(0,0, canvas.width, canvas.height);
            mel.forEach(n => {
                const x = (n.s / comp.totalDur) * canvas.width;
                const w = ((n.e - n.s) / comp.totalDur) * canvas.width;
                const y = canvas.height - ((n.pitch - minP) / (maxP - minP)) * canvas.height;
                ctx.fillStyle = n.type === "base" ? "#7c3aed" : "#0ea5e9";
                ctx.fillRect(x, y, w, 4);
            });
        }

        // --- Manejadores de Eventos ---
        document.getElementById('btnGen').onclick = () => {
            currentComp = generate();
            document.getElementById('rootDisp').innerText = midiName(currentComp.rootBase);
            document.getElementById('modeDisp').innerText = currentComp.mainMode.toUpperCase();
            document.getElementById('timeTot').innerText = fmtT(currentComp.totalDur);
            document.getElementById('btnPlay').disabled = false;
            document.getElementById('btnMidi').disabled = false;
            draw(currentComp);
        };

        document.getElementById('btnPlay').onclick = async () => {
            await Tone.start();
            Tone.Transport.stop();
            Tone.Transport.cancel();
            activeParts.forEach(p => p.dispose());
            
            const c = currentComp;
            const schedule = (notes, sampler, isDrum = false) => {
                return new Tone.Part((time, v) => {
                    if(!isDrum) sampler.triggerAttackRelease(v.p, v.d, time, v.vel);
                    else {
                        if(v.p === 36) samplers.kick.start(time);
                        if(v.p === 38) samplers.snare.start(time);
                        if(v.p === 42) samplers.hihat.start(time);
                    }
                }, notes.map(n => ({ 
                    time: n.s, p: isDrum ? n.pitch : Tone.Frequency(n.pitch, "midi").toNote(), 
                    d: n.e - n.s, vel: n.vel/127 
                }))).start(0);
            };

            activeParts = [
                schedule(c.notes.filter(n => n.type === "base"), samplers.base),
                schedule(c.notes.filter(n => n.type === "solo"), samplers.solo),
                schedule(c.notes.filter(n => n.type === "drum"), null, true)
            ];

            Tone.Transport.start();
            document.getElementById('btnPlay').disabled = true;
            document.getElementById('btnStop').disabled = false;

            progressInterval = setInterval(() => {
                const curr = Tone.Transport.seconds;
                const prog = (curr / c.totalDur) * 100;
                document.getElementById('progressBar').style.width = prog + "%";
                document.getElementById('timeCur').innerText = fmtT(curr);
                if(curr >= c.totalDur) stopMusic();
            }, 100);
        };

        function stopMusic() {
            Tone.Transport.stop();
            clearInterval(progressInterval);
            document.getElementById('btnPlay').disabled = false;
            document.getElementById('btnStop').disabled = true;
            document.getElementById('progressBar').style.width = "0%";
        }

        document.getElementById('btnStop').onclick = stopMusic;

        // Inicializar
        window.onload = initAudio;
    </script>
</body>
</html>
